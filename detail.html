<!DOCTYPE html>
<html lang="en">
<head>
    <!--Container for metadata, character encoding, title, and other external stylesheets-->
    <meta charset="UTF-8">
    <!--Ensures that characters and special symbols render correctly using UTF-8 coding-->
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <!--Ensures webpage scales accurately and is responsive to computer and mobile screens-->
    <title>Movie Details - Netflix Prototype</title>
    <!--Sets custom title displayed on broswer tab-->
    <link rel="stylesheet" href="style.css">
    <!--Links the external CSS stylesheet to maintain the dark cinema theme and overall font styling-->
</head>
<!--Closes head metadata section-->
<body style="padding: 40px;">
    <!--Main body container with 40px of inner padding allows breathing room from around the surrounding page edges-->
    <h1 style="color: #e50914; font-family: 'Bebas Neue', sans-serif; font-size: 3rem;">Movie Title Bio</h1>
    <!--Primary page heading styled with the signature Netflix red and dupe font-->
    <p style="color: #e5e5e5; font-size: 1.1rem; margin-top: 20px;">This is a placeholder bio page for the selected title. A detailed synopsis, cast information, and streaming options will appear here.</p>
    <!--A descriptive text that is a placeholder synopsis-->
    <br>
    <!--Line break element that adds a vertical gap before back nav button-->
    <a href="index.html" style="color: white; background-color: #333; padding: 10px 20px; text-decoration: none; border-radius: 4px;">&larr; Back to Browse</a>   
    <!--A hyperlink styled as a dark pill button that redirects the user back to the home page-->
</body>
<!--Main body container closed-->
</html>
<!--Closes root html doc-->
